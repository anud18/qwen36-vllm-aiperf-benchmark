# OpenTelemetry Collector config for vLLM native tracing.
# Receives OTLP spans from vLLM (--otlp-traces-endpoint) and writes them to a
# JSONL file (one OTLP-JSON object per export batch) plus a debug log.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  file:
    path: /traces/vllm_spans.jsonl
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
  telemetry:
    logs:
      level: info
