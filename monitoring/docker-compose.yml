services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.6.5
    container_name: bench-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # Receives vLLM native OTLP spans (--otlp-traces-endpoint) and writes them to
  # ../traces/vllm_spans.jsonl (+ debug log). Complements the content-logging proxy.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: bench-otel-collector
    restart: unless-stopped
    user: "0:0"   # write the span file into the host-mounted ../traces dir
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ../traces:/traces
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
